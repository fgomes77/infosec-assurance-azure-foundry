# Purpose: Atlassian Jira Cloud REST API v3 — trimmed to the operations the
#   GRC/TPRM agents need to FIND and READ remediation and TPRM finding
#   tickets. Read-only by construction (governance/HUMAN_APPROVAL.md Layer 1):
#   the four write operations this file used to carry (createIssue,
#   addComment, transitionIssue, updateIssue) have been REMOVED AT SOURCE,
#   not merely stripped at attach time. Defence in depth — attach_integrations.py
#   would strip them anyway, but a spec that does not describe a write cannot
#   have one re-enabled by a careless `write_connections` entry, and a reviewer
#   reading this file sees the real capability.
#
#   Jira writes exist ONLY inside the approval-gated Logic Apps
#   (workflows/jira-finding-sync.json), which hold their own credential.
#
#   The one non-GET kept is `searchIssuesJql`: JQL does not fit in a URL, so
#   the search is expressed as a POST. It carries `x-enx-read-only: true` and
#   its operationId is in attach_integrations.READ_ONLY_POST_OPS — both are
#   required, and verify_conversion.py audits the pair.
# Auth: HTTP Basic (Atlassian account email + API token) OR OAuth 2.0 (3LO).
#   Create an API token at https://id.atlassian.com/manage-profile/security/api-tokens
#   For OAuth 2.0, register an app at https://developer.atlassian.com/console.
# Credentials: store in Azure Key Vault; reference from the Foundry agent's
#   OpenAPI tool connection. Never embed real secrets in this file.
openapi: 3.0.3
info:
  title: Jira Cloud (GRC/TPRM subset)
  description: Read-only Jira Cloud v3 surface for finding and reading remediation and third-party-risk
    tickets from Foundry agents. No write operation is described by this spec; ticket creation and transitions
    happen only in the approval-gated workflows.
  version: '3.0'
servers:
- url: https://{your-domain}.atlassian.net
  variables:
    your-domain:
      default: your-domain
      description: Atlassian Cloud site name (tenant-specific).
security:
- basicAuth: []
- oauth2:
  - read:jira-work
  - write:jira-work
paths:
  /rest/api/3/search/jql:
    post:
      operationId: searchIssuesJql
      x-enx-read-only: true
      summary: Search issues with JQL
      description: Search Jira issues using a JQL query. Use to find open remediation or TPRM finding
        tickets, e.g. project = TPRM AND status != Done AND labels = supplier-finding. Returns paginated
        issue summaries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jql
              properties:
                jql:
                  type: string
                  description: JQL query string.
                maxResults:
                  type: integer
                  default: 50
                fields:
                  type: array
                  items:
                    type: string
                  description: Fields to return, e.g. summary, status, assignee, duedate.
                nextPageToken:
                  type: string
                  description: Pagination token from a previous page.
      responses:
        '200':
          description: Matching issues.
  /rest/api/3/issue/{issueIdOrKey}:
    get:
      operationId: getIssue
      summary: Get a single issue
      description: Retrieve full details of one issue (status, assignee, description, comments, due date)
        by key, e.g. TPRM-123. Use when a finding ticket needs to be summarised or its remediation status
        verified.
      parameters:
      - name: issueIdOrKey
        in: path
        required: true
        schema:
          type: string
      - name: fields
        in: query
        schema:
          type: string
        description: Comma-separated fields to return.
      responses:
        '200':
          description: The issue.
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: Atlassian account email as username, API token as password.
    oauth2:
      type: oauth2
      description: Atlassian OAuth 2.0 (3LO).
      flows:
        authorizationCode:
          authorizationUrl: https://auth.atlassian.com/authorize
          tokenUrl: https://auth.atlassian.com/oauth/token
          scopes:
            read:jira-work: Read issues and searches.
            write:jira-work: Create and update issues, comments, transitions.
