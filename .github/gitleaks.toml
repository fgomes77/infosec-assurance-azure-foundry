# gitleaks configuration for the InfoSec Assurance Foundry kit.
#
# Runs in CI on every PR (.github/workflows/ci.yml job `secret-scan`) and in
# the Azure DevOps equivalent (convertion/ci/azure-pipelines.yml). It is the
# repository-wide net; convertion/scripts/verify_kit.py §1 is the kit-specific
# one (tenant hostnames, e-mail addresses, Basic-auth blobs) and deploy.sh
# runs it on every deployment — governance/DATA_PROTECTION_GUARDRAILS.md §3.
#
# Rule of the repository: no real secret, hostname, UPN or e-mail address is
# ever committed. Everything that looks like one is a DOCUMENTED PLACEHOLDER
# in {braces} or <angle brackets>, a Key Vault reference, or a public Azure
# identifier. Those — and only those — are allow-listed below, each with the
# reason it is not a secret. Never widen an allowlist to silence a real
# finding: remove the value, rotate it, and file the incident
# (operations/RUNBOOK.md).
#
# This file is the single source of rules. The repository root carries a
# `.gitleaks.toml` that does nothing but `[extend] path` to here, so an
# invocation without `--config` (pre-commit, `gitleaks protect --staged`, a
# plain `gitleaks detect`) gets these rules rather than the bare defaults.
# Add rules and allow-list entries HERE, never in the root file.
#
# Local run (same as CI):
#   gitleaks detect --no-git --source . --config .github/gitleaks.toml --redact
#   gitleaks detect --no-git --source .                # via the root shim

title = "infosec-assurance-azure-foundry"

[extend]
useDefault = true

[allowlist]
description = "Documented placeholders, public Azure identifiers, generated output"
paths = [
  # Generated by convert_skills.py from the export; never committed.
  '''^convertion/build/''',
  # Staged renderer copies (git-ignored) and byte-compiled caches.
  '''^convertion/functions/delivery/renderers/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.ruff_cache/''',
  # This file and the root shim that extends it: their own examples would
  # otherwise match.
  '''^\.github/gitleaks\.toml$''',
  '''^\.gitleaks\.toml$''',
  # The pre-commit manifest names the same placeholder syntax in its comments.
  '''^\.pre-commit-config\.yaml$''',
]
regexes = [
  # 1. Placeholder syntax used throughout the kit: {upn:...}, {tenant},
  #    {jira:...}, <account>, ${VAR}, {{token}}, @{...} (Logic Apps).
  '''\{[A-Za-z0-9_.:|-]*\}''',
  '''<[A-Za-z0-9_.:/ -]{2,40}>''',
  '''\$\{?[A-Z_][A-Z0-9_]*\}?''',
  '''@\{[^}]*\}''',
  # 2. Key Vault references and managed-identity wiring — a pointer, not a value.
  '''@Microsoft\.KeyVault\([^)]*\)''',
  '''https://\{?[A-Za-z0-9-]*\}?\.vault\.azure\.net/''',
  # 3. Public Azure identifiers: built-in role definition GUIDs, subscription /
  #    tenant / client id PLACEHOLDERS. Role definition ids are published by
  #    Microsoft (learn.microsoft.com/azure/role-based-access-control/built-in-roles)
  #    and are assigned to variables named *Key*/*Access*/*Auth*, which the
  #    generic-api-key rule flags.
  '''[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}''',
  # 4. Documented non-secrets that read like credentials.
  '''(?i)(none|null|placeholder|redacted|see .*key vault|stored in key vault)''',
  '''(?i)@(example\.(com|org|net)|contoso\.com)''',
]

# NOTE on rule overrides: do NOT add a `[[rules]]` block with the id of a
# default rule to relax it — a same-id block REPLACES the default rule and
# silently removes its detection. Relax only through the allowlist above,
# which keeps every default rule active.
